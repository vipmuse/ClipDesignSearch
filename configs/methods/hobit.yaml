name: hobit
description: "에폭마다 submodular greedy 재정렬로 배치 구성 (baseline + 배치 구성 축만 변경)"
extends: configs/lora_clip.yaml
data: {builder: shared, pairs: data/pairs.jsonl}
train:
  sampler: hobit
  hobit_pool: 4096
  hobit_penalty: 10.0
  hobit_refresh_every: 1
  pk_views: 1
  locarno_aware: false
  mask_false_negatives: false
  augment: false
  img2img_weight: 0.0
